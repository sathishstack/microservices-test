version: "3.8"

services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - inventory-service
      - payment-service
      - notification-service

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    depends_on:
      - inventory-service
      - payment-service
      - notification-service

  inventory-service:
    build: ./inventory-service
    ports:
      - "8082:8082"

  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"