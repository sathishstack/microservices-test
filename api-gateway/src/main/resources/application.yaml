server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:

        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - StripPrefix=1

        - id: inventory-service
          uri: http://inventory-service:8082
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=1